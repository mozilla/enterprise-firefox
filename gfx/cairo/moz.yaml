schema: 1

bugzilla:
  product: Core
  component: "Graphics: Cairo"

origin:
  name: Cairo

  description: "Cairo: Multi-platform 2D graphics library"

  url: https://www.cairographics.org

  release: 1.18.6 (2026-09-20T17:42:13+01:00).
  revision: 1.18.6

  license: 'MPL-1.1'
  license-file: 'COPYING-MPL-1.1'

vendoring:
  url: https://gitlab.freedesktop.org/cairo/cairo
  source-hosting: gitlab
  tracking: tag
  vendor-directory: gfx/cairo/cairo

  # Upstream's history contains a malformed commit object
  # (e5b831b107ad18e78ec9ea5e6da68eb30bf71126) that predates git's fsck
  # validation and fails it (missing space before the author/committer
  # date). It has nothing to do with any revision we actually vendor;
  # it's just unreachable history that a clone would otherwise refuse
  # to transfer.
  tolerate-git-fsck-errors: true

  # Our own versions of files that upstream's Meson build generates or that
  # upstream no longer ships. We build cairo with moz.build files instead of
  # Meson, so we need them in the tree.
  keep:
    - src/cairo-features.h
    - src/cairo-platform.h
    - src/cairo-rename.h
    - src/config.h
    - src/pixman-rename.h

  exclude:
    - boilerplate
    - build
    - doc
    - ".git*"
    - "meson*"
    - "src/meson*"
    - perf
    - subprojects
    - test
    - util

  patches:
    - patches/0001-Allow-cairo_public-to-be-predefined.patch
    - patches/0002-Work-around-lack-of-full-configure-support-for-xrend.patch
    - patches/0003-Avoid-register-keyword-for-C-compatibility.patch
    - patches/0004-Expose-cairo_font_options_-get-set-_lcd_filter-as-pu.patch
    - patches/0005-Add-API-for-setting-subpixel-antialiasing.patch
    - patches/0006-Add-synth_flags-parameter-to-cairo_ft_font_face_crea.patch
    - patches/0007-Integrate-cairo-ft-font-with-Gecko-SharedFTFace.patch
    - patches/0008-Look-up-FreeType-variation-APIs-at-runtime.patch
    - patches/0009-Add-cairo_quartz_surface_get_image.patch
    - patches/0010-Add-LINK-tag-support-to-the-quartz-surface-backend.patch
    - patches/0011-Add-named-destination-support-to-cairo-quartz-surfac.patch
    - patches/0012-Prefer-named-destinations-over-URI-links-in-cairo-qu.patch
    - patches/0013-Avoid-potential-null-deref-crash-in-active_edges.patch
    - patches/0014-Build-fixes-for-iOS.patch
    - patches/0015-Guard-FT_COLOR_H-and-related-FreeType-fontconfig-sym.patch
    - patches/0016-Adapt-cairo-quartz-for-iOS-builds.patch
    - patches/0017-Don-t-prematurely-clear-cairo_quartz_image_surface_t.patch
    - patches/0018-Add-cairo_win32_surface-APIs-wanted-for-gecko.patch
    - patches/0019-Handle-CAIRO_FORMAT_A8-in-_cairo_surface_to_cgimage-.patch
    - patches/0020-Revert-cairo-quartz-.-ch-to-the-pre-1.18.0-Mozilla-m.patch
    - patches/0021-Bug-2029325-Reject-negative-sub_num-during-CFF-subse.patch
    - patches/0022-Bug-2029463-Range-check-string-id-during-subsetting..patch
    - patches/0023-Stop-ignoring-cairo-features.h.patch
    - patches/0024-Bug-2027883-Fix-integer-overflow-in-cairo-PDF-surfac.patch
    - patches/0025-Bug-2036587-No-component-alpha-for-dwrite-glyph-surfaces.patch
