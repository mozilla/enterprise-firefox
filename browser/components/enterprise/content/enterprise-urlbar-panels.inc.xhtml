<html:link rel="stylesheet" href="chrome://browser/content/enterprise/enterprise-tokens.css" />
<html:link rel="stylesheet" href="chrome://browser/content/enterprise/enterprise-urlbar-actions.css" />
<html:link rel="localization" href="toolkit/enterprise/enterprise.ftl" />

<panelview id="panelUI-lockdown-mode" class="PanelUI-subView enterprise-urlbar-panel-subview"
           has-custom-header="true">
  <box class="panel-header">
    <html:h1>
      <html:span data-l10n-id="lockdown-mode-popup-header" />
    </html:h1>
  </box>
  <toolbarseparator />
  <vbox class="panel-subview-body">
    <html:div data-l10n-id="lockdown-mode-popup-message" />
  </vbox>
  <vbox id="lockdown-mode-details-footer" class="panel-subview-footer-button">
    <toolbarseparator />
    <toolbarbutton id="lockdown-mode-details-button"
                   class="subviewbutton subviewbutton-nav"
                   closemenu="none">
      <label class="toolbarbutton-text" flex="1" data-l10n-id="lockdown-mode-details-label" />
      <label id="lockdown-mode-details-count" class="toolbarbutton-text" />
    </toolbarbutton>
  </vbox>
</panelview>

<panelview id="panelUI-lockdown-mode-details" class="PanelUI-subView enterprise-urlbar-panel-subview"
           data-l10n-id="lockdown-mode-details-header"
           data-l10n-attrs="title">
  <vbox id="lockdown-mode-details-list" class="panel-subview-body" />
  <toolbarseparator />
  <hbox id="lockdown-mode-copy-details-footer" class="panel-footer" pack="end" align="center">
    <html:moz-button id="lockdown-mode-copy-details-button"
                     closemenu="none"
                     data-l10n-id="lockdown-mode-copy-details-button" />
    <html:span id="lockdown-mode-details-copied" role="status" tabindex="-1" />
  </hbox>
</panelview>

<panelview id="panelUI-access-connector" class="PanelUI-subView enterprise-urlbar-panel-subview"
           has-custom-header="true">
  <box class="panel-header">
    <html:h1>
      <html:span id="access-connector-panel-header" data-l10n-id="access-connector-panel-header" />
    </html:h1>
  </box>
  <toolbarseparator />
  <vbox class="panel-subview-body">
    <html:div id="access-connector-panel-message" data-l10n-id="access-connector-panel-message" />
  </vbox>
</panelview>
