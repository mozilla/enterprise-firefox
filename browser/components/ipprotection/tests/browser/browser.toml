[DEFAULT]
support-files = [
  "head.js",
]

prefs = [
  "browser.ipProtection.log=true",
  "browser.ipProtection.features.siteExceptions=true",
  "dom.security.https_first=false",
  "browser.ipProtection.bandwidth.enabled=true",
]

["browser_IPPChannelFilter.js"]

["browser_IPPProxyManager.js"]
skip-if = [
  "enterprise", # Enterprise uses a different panel template without status card, paused, or upgrade UI.
]

["browser_IPPUsageHelper.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the usage.
]

["browser_IPProtectionService.js"]
skip-if = [
  "enterprise", # Enterprise uses IPPEnterpriseAuthProvider which has no enrollment, entitlement, or FxA sign-in flow, and does not show the standard panel or toolbar button.
]

["browser_guardian_client.js"]
skip-if = [
  "enterprise", # Enterprise uses IPPEnterpriseAuthProvider which does not use the Guardian client.
]

["browser_ipprotection_alert_manager.js"]

["browser_ipprotection_bandwidth_precision.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the bandwidth UI.
]

["browser_ipprotection_confirmation_hints_site_exclusion.js"]
skip-if = [
  "enterprise", # Enterprise has no site exclusion feature; confirmation hints on tab navigation never fire.
]

["browser_ipprotection_content.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel.
]

["browser_ipprotection_content_site_exclusion.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the site exclusion UI.
]

["browser_ipprotection_content_unauthenticated.js"]
skip-if = [
  "enterprise", # Enterprise is always authenticated; there is no unauthenticated panel UI.
]

["browser_ipprotection_header.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the header.
]

["browser_ipprotection_infobar.js"]

["browser_ipprotection_keyboard_navigation.js"]
skip-if = [
  "enterprise", # Enterprise renders a different panel template; the navigable elements these tests rely on don't exist.
]

["browser_ipprotection_location_selector_telemetry.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the location selector.
]

["browser_ipprotection_locations_keyboard_navigation.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel.
]

["browser_ipprotection_locations_list.js"]
skip-if = [
  "enterprise", # Enterprise does not initialize the IP Protection panel, so getPanel() returns null.
]

["browser_ipprotection_message_bar.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the message bar.
]

["browser_ipprotection_network_error.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the network errors.
]

["browser_ipprotection_optout.js"]
skip-if = [
  "enterprise", # Enterprise does not initialize the IP Protection toolbar button or widget.
]

["browser_ipprotection_panel.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel.
]

["browser_ipprotection_proxy_errors.js"]

["browser_ipprotection_status_box.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the status box.
]

["browser_ipprotection_status_card.js"]
skip-if = [
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel containing the status card.
]

["browser_ipprotection_telemetry.js"]
skip-if = [
  "enterprise", # Enterprise uses IPPEnterpriseAuthProvider with no user-facing toggle, enrollment, or exclusion flow; nearly all telemetry events tested here cannot be triggered in Enterprise.
]

["browser_ipprotection_toolbar.js"]
skip-if = [
  "devedition",
  "enterprise", # Enterprise does not show the IP Protection toolbar button or panel.
]

["browser_ipprotection_utils.js"]

["browser_ipprotection_viewer_site_exclusion.js"]

["browser_ipprotection_window_close.js"]
