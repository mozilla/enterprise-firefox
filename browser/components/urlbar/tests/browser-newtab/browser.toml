[DEFAULT]
tags = "urlbar"
support-files = [
  "../browser/head-common.js",
  "../browser/print_postdata.sjs",
  "head.js",
  "richSuggestionEngine.sjs",
]
prefs = ["browser.urlbar.newtab.featureGate=true"]
# Painting the results view, anchored inside New Tab's sticky search
# wrapper, asserts in a debug build. Bug 2065180.
skip-if = ["debug"]

["browser_blur.js"]

["browser_engineIcon.js"]

["browser_escape.js"]

["browser_mousedown.js"]

["browser_pickResult.js"]

["browser_placeholder.js"]

["browser_resultIcon.js"]

["browser_resultMenu.js"]

["browser_searchModeSwitcher.js"]

["browser_searchTelemetry.js"]
support-files = [
  "../../../search/test/browser/telemetry/searchTelemetry.html",
  "../../../search/test/browser/telemetry/searchTelemetryAd.html",
  "../../../search/test/browser/telemetry/serp.css",
]

["browser_topLayer.js"]

["browser_viewBounds.js"]
