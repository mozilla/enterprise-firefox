[DEFAULT]
tags = "urlbar"
support-files = [
  "../browser/head-common.js",
  "head.js",
]
prefs = [
  "browser.urlbar.trending.featureGate=false",
]

["browser_trust_panel.js"]
https_first_disabled = true
support-files = ["!/browser/base/content/test/protectionsUI/trackingPage.html"]

["browser_trust_panel_cert_exception.js"]
skip-if = [
  "os == 'mac' && os_version == '15.30' && arch == 'aarch64' && opt", # Bug 2062455
]

["browser_trust_panel_focus.js"]

["browser_trust_panel_icon.js"]
https_first_disabled = true
support-files = ["!/browser/base/content/test/protectionsUI/trackingPage.html"]

["browser_trust_panel_pages.js"]
https_first_disabled = true

["browser_trust_panel_security_view.js"]
https_first_disabled = true
