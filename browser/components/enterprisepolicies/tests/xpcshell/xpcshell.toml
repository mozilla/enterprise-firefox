[DEFAULT]
run-if = [
  "os != 'android'",
]
firefox-appdir = "browser"
head = "head.js"
support-files = [
  "policytest_v0.1.xpi",
  "../../../../../toolkit/mozapps/extensions/test/xpinstall/amosigned-sha1only.xpi"
]

["test_3rdparty.js"]

["test_PolicySchemaValidator.js"]

["test_addon_update.js"]

["test_aichatbot.js"]
# Only run in MOZ_ENTERPRISE builds
run-if = ["enterprise"]

["test_appupdatepin.js"]

["test_appupdateurl.js"]

["test_bug1658259.js"]

["test_cleanup.js"]

["test_clear_blocked_cookies.js"]

["test_containers.js"]

["test_defaultbrowsercheck.js"]

["test_empty_policy.js"]

["test_exempt_domain_file_type_pairs_from_file_type_download_warnings.js"]

["test_extensions.js"]

["test_extensionsettings.js"]

["test_extensionsettings_blocked_permissions.js"]

["test_extensionsettings_install_without_url.js"]

["test_import_enterprise_roots.js"]

["test_local_network_access.js"]

["test_macos_policy_validation.js"]

["test_macosparser_unflatten.js"]
run-if = [
  "os == 'mac'",
]

["test_permissions.js"]
skip-if = ["enterprise"] # Bug 2065476: skip tests for enterprise builds ; re-enable in bug 2065477

["test_policies_schema.js"]
support-files = [
  "../../schemas/policies-schema.json",
  "../../schemas/policies-schema.meta.json",
]

["test_policy_descriptions.js"]

["test_policy_search_engine.js"]

["test_popups_cookies_addons.js"]
support-files = ["config_popups_cookies_addons.json"]
skip-if = ["enterprise"] # Bug 2065476: skip tests for enterprise builds ; re-enable in bug 2065477

["test_preferences.js"]

["test_proxy.js"]

["test_requestedlocales.js"]

["test_runOnce_helper.js"]

["test_security_devices.js"]

["test_security_logging.js"]
run-if = ["enterprise"]

["test_simple_pref_policies.js"]

["test_sitepolicies.js"]

["test_sorted_alphabetically.js"]

["test_sync.js"]
# The Sync policy only exists in enterprise builds.
run-if = ["enterprise"]

["test_telemetry.js"]

["test_watermark.js"]
# Only run in MOZ_ENTERPRISE builds
run-if = ["enterprise"]

["test_webserial.js"]

["test_websitefilter.js"]
