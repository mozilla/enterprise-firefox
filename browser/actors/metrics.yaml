# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Firefox :: General'

fullscreen:
  change:
    type: timing_distribution
    description: >
      The time content uses to enter/exit fullscreen regardless of fullscreen
      transition timeout

      This metric was generated to correspond to the Legacy Telemetry
      exponential histogram FULLSCREEN_CHANGE_MS.
    time_unit: millisecond
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1271160
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=1271160
    notification_emails:
      - mozilla-telemetry@upsuper.org
    expires: never
    telemetry_mirror: FULLSCREEN_CHANGE_MS

#ifdef MOZ_ENTERPRISE
security:
  unsafe_site_visit:
    type: event
    data_sensitivity:
      - highly_sensitive
    description: >
      Recorded when a user navigates to a top-level site blocked by Safe
      Browsing (malware, phishing, unwanted software, or harmful application).
      Only collected when MOZ_ENTERPRISE is defined and enabled.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2039258
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=2039258
    notification_emails:
      - security-telemetry@mozilla.org
      - enterprise-telemetry@mozilla.org
    expires: never
    send_in_pings:
      - enterprise
    extra_keys:
      url:
        description: >
          The URL of the unsafe site that was blocked. Collection level is
          configurable via the
          browser.safebrowsing.enterprise.telemetry.unsafeSiteVisit.urlLogging
          pref: "full" (default), "domain", or "none".
        type: string
      threat_type:
        description: >
          The type of threat detected: "malware", "phishing", "unwanted", or
          "harmful".
        type: string
      provider:
        description: >
          The Safe Browsing provider that flagged the site (e.g. "google4").
        type: string
      list:
        description: >
          The Safe Browsing list that matched the site.
        type: string
#endif
