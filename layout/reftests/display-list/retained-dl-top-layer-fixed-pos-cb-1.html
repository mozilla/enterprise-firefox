<!DOCTYPE html>
<html class="reftest-wait">
<head>
<style>
  body {
    margin: 0px;
  }
  #popover {
    position: absolute;
    inset: 0 auto auto 0;
    margin: 0;
    border: none;
    padding: 0;
    overflow: visible;
    width: 200px;
    height: 200px;
    background: transparent;
    contain: paint;
  }
  #popover > div {
    position: absolute;
    top: 0;
    left: 0;
    width: 100px;
    height: 100px;
    background-color: red;
  }
  #over {
    z-index: 1;
  }
  #unrelated {
    position: absolute;
    top: 300px;
    left: 0;
    width: 100px;
    height: 100px;
    background-color: blue;
  }
</style>
</head>
<body>
  <div id="popover" popover="manual">
    <div class="reftest-display-list"></div>
    <div id="over"></div>
  </div>
  <div id="unrelated" class="reftest-no-display-list"></div>
</body>
<script>
document.getElementById("popover").showPopover();

function doTest() {
  document.getElementById("over").style.backgroundColor = "green";
  document.documentElement.removeAttribute("class");
}

window.addEventListener("MozReftestInvalidate", doTest);
</script>
</html>
