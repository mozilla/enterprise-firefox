plugins {
    id 'com.android.library'
    alias(libs.plugins.dependency.analysis)
}

android {
    namespace = 'mozilla.components.feature.tabdata.coordinator'
    testFixtures {
        enable = true
    }
}

dependencies {
    api project(':components:feature-tabgroups-storage')

    implementation project(':components:support-base')
    implementation project(':components:support-utils')

    implementation libs.kotlinx.coroutines

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit4
    testRuntimeOnly libs.junit.platform.launcher
    testRuntimeOnly libs.junit.vintage
    testImplementation libs.kotlin.test
    testImplementation libs.kotlinx.coroutines.test
    testFixturesImplementation libs.kotlinx.coroutines
    testImplementation testFixtures(project(':components:feature-tabgroups-storage'))
    testImplementation testFixtures(project(':components:support-utils'))
}

apply from: '../../../common-config.gradle'
apply from: '../../../publish.gradle'
ext.configurePublish(config.componentsGroupId, project.name, project.ext.description)
