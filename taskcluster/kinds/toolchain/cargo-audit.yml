---
task-defaults:
    description: "cargo-audit toolchain build"
    attributes:
        local-toolchain: true
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        script: build-rust-based-toolchain.sh
        toolchain-artifact: public/build/cargo-audit.tar.zst
    fetches:
        fetch:
            - cargo-audit

linux64-cargo-audit:
    treeherder:
        symbol: TL(cargo-audit)
    run:
        arguments: ['x86_64-unknown-linux-gnu']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-toolchain
            - linux64-toolchain-sysroot

linux64-aarch64-cargo-audit:
    treeherder:
        symbol: TLA64(cargo-audit)
    run:
        arguments: ['aarch64-unknown-linux-gnu']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-toolchain
            - linux64-aarch64-toolchain-sysroot

macosx64-cargo-audit:
    treeherder:
        symbol: TM(cargo-audit)
    run:
        arguments: ['x86_64-apple-darwin']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-macos-toolchain
            - macosx64-sdk-toolchain

macosx64-aarch64-cargo-audit:
    treeherder:
        symbol: TMA64(cargo-audit)
    run:
        arguments: ['aarch64-apple-darwin']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-macos-toolchain
            - macosx64-sdk-toolchain

win64-cargo-audit:
    treeherder:
        symbol: TW64(cargo-audit)
    run:
        arguments: ['x86_64-pc-windows-msvc']
        toolchain-alias: win64-aarch64-cargo-audit
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-windows-toolchain
            - vs-toolchain
