---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.from_deps
    - gecko_taskgraph.transforms.enterprise_release_push
    - gecko_taskgraph.transforms.job
    - gecko_taskgraph.transforms.task

kind-dependencies:
    - enterprise-release-push
    - toolchain

task-defaults:
    description: "Ship a Firefox Enterprise OCI release by tagging the staged digest."
    run-on-projects: [enterprise-firefox]
    shipping-product: firefox-enterprise
    shipping-phase: ship
    attributes:
        shippable: true
    from-deps:
        # `fetch` is a kind-dependency only so the moa fetch artifact resolves;
        # restrict the fan-out to the per-console push tasks.
        kinds:
            - enterprise-release-push
        group-by: single
    worker-type: b-linux
    worker:
        docker-image: {in-tree: lint}
        max-run-time: 1800
        taskcluster-proxy: true
        env:
            REGISTRY_REFERENCE: harbor.stage.fx-enterprise.nonprod.webservices.mozgcp.net/enterprise-shipit-dev/firefox
    scopes:
        # `{name}` is the repository of REGISTRY_REFERENCE with its slashes
        # flattened; the transform renders it (see its SECRET_PATH).
        - secrets:get:project/enterprise/level-{level}/oci-registry/{name}
        # moa downloads the (private) enterprise repack artifacts referenced by
        # the release definition.
        # TODO: Re-enable - queue:get-artifact:project/enterprise/repacks/*
    run:
        using: run-task
        checkout: true
        cwd: "{checkout}"
        command: >-
            bash taskcluster/scripts/ship-enterprise-release.sh
    fetches:
        enterprise-release-push:
            - artifact: release-index.json
              extract: false
        toolchain:
            - linux64-mozilla-oci-artifacts-cli
    treeherder:
        symbol: "Ent(ship)"
        kind: other
        tier: 1
        platform: firefox-release-enterprise/opt

tasks:
    ship: {}
