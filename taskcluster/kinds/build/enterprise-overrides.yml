---
# Enterprise-only settings for the build tasks shared with mozilla-central,
# applied by gecko_taskgraph.transforms.enterprise_overrides, so that their
# definitions in linux.yml, macosx.yml and windows.yml stay identical to
# mozilla-central's. Dicts are merged, list items appended and null removes a
# key.

linux64-enterprise/opt:
    run-on-projects: [enterprise-firefox]
    worker-type: b-linux-docker-xlarge-amd
    treeherder:
        tier: 1
    attributes:
        code-review: true
    worker:
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"

linux64-enterprise/debug:
    run-on-projects: [enterprise-firefox]
    worker-type: b-linux-docker-xlarge-amd
    treeherder:
        tier: 1
    attributes:
        code-review: true
    worker:
        env:
            MOZ_AUTOMATION_PACKAGE_TESTS: "1"

