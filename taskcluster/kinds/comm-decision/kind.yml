---
# The decision task of the Thunderbird (comm) graph, a copy of the running
# decision task made with mozilla_taskgraph's replicate transform. See
# gecko_taskgraph/util/comm_decision.py.
loader: taskgraph.loader.transform:loader

transforms:
    - gecko_taskgraph.transforms.comm_decision:transforms

tasks:
    comm-decision:
        description: The task that creates all Thunderbird tasks of this push
        attributes:
            run_on_projects: [enterprise-firefox]
            run_on_repo_type: [git]
