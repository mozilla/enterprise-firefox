---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.task_context
    - taskgraph.transforms.from_deps
    - gecko_taskgraph.transforms.convert_if_deps
    - gecko_taskgraph.transforms.task

kind-dependencies:
    - repackage-deb
    - repackage-signing-msi
    - repackage-signing-msix
    - enterprise-repack-mac-notarization

task-defaults:
    description: "Blocks until all {name} tasks are complete."
    from-deps:
        group-by: all
        unique-kinds: false
        set-name: false
    index:
        product: firefox
        job-name: "complete-{name}"
    task-context:
        substitution-fields:
            - description
            - index.job-name
            - treeherder.symbol
    treeherder:
        kind: build
        tier: 1
        symbol: "Complete({symbol})"
        platform: gecko-decision/opt
    worker-type: succeed

tasks:
    enterprise-repack:
        from-deps:
            kinds:
                - repackage-deb
                - repackage-signing-msi
                - repackage-signing-msix
                - enterprise-repack-mac-notarization
            with-attributes:
                shipping_product: firefox-enterprise
        index:
            type: shippable
        run-on-projects: [enterprise-firefox]
        task-context:
            from-object:
                symbol: Rpk-Ent
