---
loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.from_deps
    - gecko_taskgraph.transforms.enterprise_oci_registry
    - gecko_taskgraph.transforms.job
    - gecko_taskgraph.transforms.task

kind-dependencies:
    - enterprise-oci-upload
    - toolchain

task-defaults:
    description: "Ship a Firefox Enterprise OCI release by tagging the staged digest."
    run-on-projects: [enterprise-firefox]
    shipping-product: firefox-enterprise
    shipping-phase: ship
    attributes:
        shippable: true
    from-deps:
        # One task per upload task, so one per console.
        kinds:
            - enterprise-oci-upload
        group-by: single
    worker-type: b-linux
    worker:
        docker-image: {in-tree: lint}
        max-run-time: 1800
        taskcluster-proxy: true
        env:
            REGISTRY_REFERENCE: harbor.stage.fx-enterprise.nonprod.webservices.mozgcp.net/enterprise-shipit-dev/firefox
    scopes:
        # The registry credentials, named here and nowhere else. The
        # enterprise_oci_registry transform reads REGISTRY_SECRET back from
        # this scope. `{name}` is the repository of REGISTRY_REFERENCE with its
        # slashes flattened, which only that transform knows, so it fills it in.
        - secrets:get:project/enterprise/level-{level}/oci-registry/{name}
        # moa downloads the (private) enterprise repack artifacts referenced by
        # the release definition.
        # TODO: Re-enable BEFORE MERGING - queue:get-artifact:project/enterprise/repacks/*
    run:
        using: run-task
        checkout: true
        cwd: "{checkout}"
        command: >-
            bash taskcluster/scripts/enterprise-oci-tag.sh
    fetches:
        enterprise-oci-upload:
            - artifact: release-index.json
              extract: false
        toolchain:
            - linux64-mozilla-oci-artifacts-cli
    treeherder:
        symbol: "Ent(ship)"
        kind: other
        tier: 1
        platform: firefox-release-enterprise/opt

tasks:
    ship: {}
