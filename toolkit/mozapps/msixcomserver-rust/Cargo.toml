[package]
name = "msixcomserver_s"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
# `mozbuild::config::MOZ_APP_NAME` is used to locate firefox.exe.
mozbuild = "0.1"
mozilla-central-workspace-hack = { version = "0.1", features = [
    "msixcomserver_s",
], optional = true }
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "ApplicationModel_Background",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[lib]
name = "msixcomserver_s"
crate-type = ["staticlib"]
