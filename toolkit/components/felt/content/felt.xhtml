<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  role="document"
  class="system-font-size"
  id="felt-window"
  windowtype="navigator:browser"
>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:" />
    <link rel="stylesheet" href="chrome://felt/content/styles/felt.css" />
    <link rel="localization" href="toolkit/enterprise/felt.ftl" />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="toolkit/global/textActions.ftl" />
    <link rel="localization" href="toolkit/enterprise/enterprise.ftl" />
    <link rel="localization" href="toolkit/neterror/certError.ftl" />
    <link rel="localization" href="toolkit/neterror/netError.ftl" />
    <link rel="localization" href="toolkit/neterror/nsserrors.ftl" />
    <script
      type="application/javascript"
      src="chrome://global/content/customElements.js"
    ></script>
    <script
      type="application/javascript"
      src="chrome://global/content/globalOverlay.js"
    ></script>
    <script
      type="application/javascript"
      src="chrome://global/content/editMenuOverlay.js"
    ></script>
    <script
      type="application/javascript"
      src="chrome://felt/content/window.js"
    ></script>
    <title data-l10n-id="felt-window-title"></title>
  </head>

  <body>
    <xul:panel
      id="notification-popup"
      type="arrow"
      position="after_start"
      hidden="true"
      orient="vertical"
      noautofocus="true"
      role="alert"
      remote="true"
    />

    <xul:commandset />

    <xul:menupopup id="textbox-contextmenu" showservicesmenu="true">
      <xul:menuitem
        id="context-undo"
        data-l10n-id="text-action-undo"
        command="cmd_undo"
      />
      <xul:menuitem
        id="context-redo"
        data-l10n-id="text-action-redo"
        command="cmd_redo"
      />
      <xul:menuseparator id="context-sep-redo" />
      <xul:menuitem
        id="context-cut"
        data-l10n-id="text-action-cut"
        command="cmd_cut"
      />
      <xul:menuitem
        id="context-copy"
        data-l10n-id="text-action-copy"
        command="cmd_copy"
      />
      <xul:menuitem
        id="context-paste"
        data-l10n-id="text-action-paste"
        command="cmd_paste"
      />
      <xul:menuitem
        id="context-delete"
        data-l10n-id="text-action-delete"
        command="cmd_delete"
      />
      <xul:menuitem
        id="context-selectall"
        data-l10n-id="text-action-select-all"
        command="cmd_selectAll"
      />
      <xul:menuitem
        id="textbox-contextmenu-reveal-password"
        data-l10n-id="text-action-reveal-password"
        type="checkbox"
      />
    </xul:menupopup>

    <xul:box
      id="notification-popup-box"
      class="anchor-root"
      hidden="true"
      align="start"
    >
      <!-- We won't display the icon but need it as anchor element. -->
      <xul:image
        id="webauthn-notification-icon"
        class="notification-anchor-icon"
        role="button"
        data-l10n-id="felt-urlbar-web-authn-anchor"
      />
    </xul:box>

    <div class="felt">
      <div class="felt-logo">
        <div class="felt-logo__container"></div>
      </div>
      <div class="felt-updates is-hidden">
        <div class="felt-updates-pane">
          <img class="enterprise-wordmark" />
          <div class="felt-updates__infos">
            <h1
              class="felt-updates__title"
              data-l10n-id="felt-updates-title"
            ></h1>
            <div class="felt-updates-checking is-hidden">
              <img class="felt-updates-spinner" />
              <span
                class="felt-updates-checking-msg"
                data-l10n-id="felt-updates-checking"
              >
              </span>
            </div>
            <div class="felt-updates-application is-hidden">
              <label
                class="felt-updates-application-msg"
                for="felt-updates-progress"
                data-l10n-id="felt-updates-application"
              ></label>
              <progress
                id="felt-updates-progress"
                max="100"
                value="0"
              ></progress>
            </div>
          </div>
        </div>
        <span
          class="felt-powered-by text-deemphasized"
          data-l10n-id="felt-powered-by"
        >
        </span>
      </div>
      <div class="felt-login">
        <div class="felt-login__email-pane">
          <img class="enterprise-wordmark" />
          <form class="felt-form">
            <h1 class="felt-form__title" data-l10n-id="felt-sso-title"></h1>
            <div class="felt-form__elements">
              <moz-input-text
                id="felt-form__email"
                data-l10n-id="felt-sso-input-email"
                class="fill-width"
              ></moz-input-text>
              <moz-button
                id="felt-form__sign-in-btn"
                data-l10n-id="felt-sso-continue-btn"
                type="primary"
                class="fill-width"
                disabled="true"
              ></moz-button>
            </div>
          </form>
        </div>
        <div class="felt-updates-message is-hidden">
          <span
            class="felt-updates-uptodate"
            data-l10n-id="felt-updates-uptodate"
          >
          </span>
        </div>
        <div class="felt-browser-error">
          <moz-message-bar
            class="felt-browser-error-multiple-crashes is-hidden"
            data-l10n-id="felt-browser-error-multiple-crashes2"
            type="error"
            dismissable="true"
          ></moz-message-bar>
          <moz-message-bar
            class="felt-browser-error-token-refresh-failed is-hidden"
            data-l10n-id="felt-browser-error-token-refresh-failed"
            type="info"
          ></moz-message-bar>
          <moz-message-bar
            class="felt-browser-error-launch-failure is-hidden"
            data-l10n-id="felt-browser-error-launch-failure"
            type="error"
            dismissable="true"
          ></moz-message-bar>
          <moz-message-bar
            class="felt-error-primary-secret is-hidden"
            data-l10n-id="felt-error-primary-secret"
            type="error"
            dismissable="true"
          ></moz-message-bar>
          <moz-message-bar
            class="felt-browser-error-no-network is-hidden"
            data-l10n-id="felt-browser-error-no-network"
            type="error"
            dismissable="true"
          >
            <span slot="message" class="felt-browser-error-details"></span>
          </moz-message-bar>
          <moz-message-bar
            class="felt-browser-error-connection is-hidden"
            data-l10n-id="felt-browser-error-connection2"
            type="error"
            dismissable="true"
          >
            <span slot="message" class="felt-browser-error-details"></span>
          </moz-message-bar>
          <moz-message-bar
            class="felt-browser-error-sso-timeout is-hidden"
            data-l10n-id="felt-browser-error-sso-timeout2"
            type="error"
            dismissable="true"
          ></moz-message-bar>
          <moz-message-bar
            class="felt-updates-error-messages is-hidden"
            data-l10n-id="felt-error-updates"
            type="error"
            dismissable="true"
          >
            <span slot="message" class="felt-browser-error-details"></span>
          </moz-message-bar>
          <moz-message-bar
            class="felt-updates-warning-messages is-hidden"
            type="warning"
            dismissable="true"
          >
            <span slot="message" class="felt-browser-error-details"></span>
          </moz-message-bar>
        </div>
        <span
          class="felt-powered-by text-deemphasized"
          data-l10n-id="felt-powered-by"
        >
        </span>

        <div class="felt-login__sso is-hidden">
          <browser
            xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
            id="browser"
            type="content"
            disablehistory="true"
            disableglobalhistory="true"
            remote="true"
            maychangeremoteness="true"
          ></browser>
        </div>
      </div>
      <span class="felt-version text-deemphasized"></span>
    </div>
  </body>
</html>
