[DEFAULT]
head = "head.js"

["test_FeltLocking.js"]

["test_FeltStorage_locking.js"]

["test_felt_browser_endpoint_refusal.js"]
# Launches the application binary. On Windows the startup errors it exercises
# are shown in a message box, so it would hang there.
run-if = ["os != 'win' && buildapp == 'browser'"]
run-sequentially = ["true"]

["test_felt_browser_ipc_args.js"]
run-if = ["buildapp == 'browser'"]

["test_felt_browser_pid_announcement.js"]
run-if = ["os == 'win' && buildapp == 'browser'"]

["test_felt_ipc_channel_refusal.js"]
run-if = ["buildapp == 'browser'"]
run-sequentially = ["true"] # Launches the application binary
