---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Firefox :: Data Loss Prevention'

# The following metrics are used to track the usage of the Data Loss Prevention feature.

content_analysis:
  connection_attempt:
    type: counter
    description: Recorded when Firefox attempts to
     connect to the DLP agent.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  connection_attempt_retry:
    type: counter
    description: Recorded when Firefox attempts to
     retry connecting to the DLP agent (because a previous
     attempt to communicate with the agent failed).
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  connection_failure:
    type: labeled_counter
    description: Recorded when Firefox fails to connect to the DLP
     agent. The label is the nsresult that was returned by the
     connection attempt.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  agent_name:
    type: string
    description: The name of the DLP agent that Firefox is
     connected to. This is set via enterprise policy.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  interception_points_turned_off:
    type: string_list
    description: The interception points that are turned off
     via enterprise policy.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  show_blocked_result:
    type: boolean
    description: The show_blocked_result pref that is set
     via enterprise policy.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  default_result:
    type: quantity
    description: The default_result pref that is set
     via enterprise policy.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
    unit: BlockWarnAllow
  timeout_result:
    type: quantity
    description: The timeout_result pref that is set
     via enterprise policy.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
    unit: BlockWarnAllow
  client_signature:
    type: string
    description: The client_signature pref that is set
     via enterprise policy.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  bypass_for_same_tab_operations:
    type: boolean
    description: The bypass_for_same_tab_operations pref that is set
     via enterprise policy.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  allow_url_regex_list_set:
    type: boolean
    description: Whether the allow_url_regex_list pref is set
     to a non-default value.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  deny_url_regex_list_set:
    type: boolean
    description: Whether the deny_url_regex_list pref is set
     to a non-default value.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - technical
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  request_allowed_by_allow_url:
    type: counter
    description: Recorded when a request is allowed by the
     allow_url_regex_list.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  request_blocked_by_deny_url:
    type: counter
    description: Recorded when a request is blocked by the
     deny_url_regex_list.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  request_sent_by_analysis_type:
    type: labeled_counter
    description: Recorded when a request is sent to the DLP agent.
     The label is the analysisType of the request, which corresponds
     to a value in the AnalysisConnector enum in analysis.proto.
     (e.g. "FILE_DOWNLOADED", "FILE_ATTACHED", "BULK_DATA_ENTRY", etc.)
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  request_sent_by_reason:
    type: labeled_counter
    description: Recorded when a request is sent to the DLP agent.
     The label is the reason of the request, which corresponds to
     a value in the ContentAnalysisRequest::Reason enum in analysis.proto.
     (e.g. "CLIPBOARD_PASTE", "DRAG_AND_DROP", etc.)
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  response_duration_by_analysis_type:
    type: labeled_timing_distribution
    time_unit: microsecond
    description: The time between sending a request to the DLP agent
     and receiving a response from the agent. The label is the analysisType
     of the request.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
  response_action:
    type: labeled_counter
    description: Recorded when a response is received from the DLP agent.
     The label is the action of the response, converted to a string (so "1").
     The values correspond to nsIContentAnalysisResponse::Action.
    bugs:
      - https://bugzil.la/1963385
    data_reviews:
      - https://bugzil.la/1963385
    data_sensitivity:
      - interaction
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - haftandilian@mozilla.com
      - dparks@mozilla.com
#ifdef MOZ_ENTERPRISE
  rule_triggered:
    type: event
    description: Recorded when content analysis (DLP) makes a decision
     about a user action (paste, upload, download, print, etc), subject
     to the ContentAnalysisTelemetry enterprise policy's filtering.
     Only collected when MOZ_ENTERPRISE is defined and enabled.
    bugs:
      - https://bugzil.la/2043142
    data_reviews:
      - https://bugzil.la/TBD
    data_sensitivity:
      - highly_sensitive
    expires: never
    notification_emails:
      - gstoll@mozilla.com
      - jmendez@mozilla.com
      - enterprise-telemetry@mozilla.org
    send_in_pings:
      - enterprise
    extra_keys:
      operation:
        description: >
          The user action that triggered content analysis (e.g. "clipboard",
          "dropped_text", "print", "upload", "download").
        type: string
      url:
        description: >
          The URL of the page/content the action was performed on. Full
          URL, hostname only, or omitted (empty string) depending on the
          ContentAnalysisTelemetry policy's UrlLogging setting.
        type: string
      action:
        description: >
          The DLP verdict: "block", "warn", "allow", "report_only", or
          "canceled". "canceled" means the operation did not proceed but no
          block dialog was shown, which is what content analysis reports when
          a request fails while browser.contentanalysis.default_result is
          "block", and when the user cancels the operation themselves; see
          the cancel_error extra key to tell those apart.
        type: string
      type:
        description: >
          One of "verdict" (a genuine DLP verdict), "error_fallback" (Firefox
          fell back to the configured default result because content analysis
          itself failed, e.g. the agent was unreachable or timed out),
          "warn_resolution" (a report of what the user chose to do after a
          "warn" verdict), or "warn_cancel" (a "warn" verdict was resolved
          because the request was canceled, e.g. at shutdown, rather than
          because the user chose something). For the last two, see the action
          extra key for the allow/block the warn was resolved to.
        type: string
      is_builtin:
        description: >
          Whether the in-process WASM engine (true) or an external agent
          (false) produced the verdict.
        type: boolean
      analysis_type:
        description: >
          The analysisType of the request, which corresponds to a value in
          the AnalysisConnector enum in analysis.proto (e.g.
          "FILE_DOWNLOADED", "FILE_ATTACHED", "BULK_DATA_ENTRY"). Matches
          the labels used by content_analysis.request_sent_by_analysis_type.
        type: string
      reason:
        description: >
          The reason the request was created, which corresponds to a value
          in the ContentAnalysisRequest::Reason enum in analysis.proto (e.g.
          "CLIPBOARD_PASTE", "DRAG_AND_DROP"). Matches the labels used by
          content_analysis.request_sent_by_reason.
        type: string
      cancel_error:
        description: >
          Why the request was canceled or why content analysis failed, for
          "canceled" actions and "error_fallback" events: one of
          "user_initiated", "no_agent", "invalid_agent_signature",
          "error_other", "other_request_in_group_cancelled", "shutdown", or
          "timeout". Empty string otherwise, where content analysis does not
          define it.
        type: string
      is_cached:
        description: >
          Whether this verdict was reused from an identical request that was
          analyzed earlier, rather than being sent for analysis again.
        type: boolean
#endif
